<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #08090F; font-family: "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7DF9C4; } a:hover { color: #F2F4F8; }
    * { box-sizing: border-box; }
    .disp { font-family: Unbounded, "Arial Black", sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .kick { font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.014); } }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
    .breathe { animation: breathe 4.5s ease-in-out infinite; }
    .sweep { animation: sweep 3.4s ease-in-out infinite; }
    .bob { animation: bob 2.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #08090F; color: #F2F4F8; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: 150px; left: 50%; margin-left: -280px; width: 560px; height: 460px; background: radial-gradient(ellipse at center, rgba(239,1,7,0.16) 0%, rgba(239,1,7,0) 68%); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 20px 0; position: relative; z-index: 3;">
    <svg viewBox="0 0 22 26" width="22" height="26" aria-hidden="true"><path d="M11 1 L20 4 V14 C20 20 15.5 23.5 11 25 C6.5 23.5 2 20 2 14 V4 Z" fill="#EF0107"></path></svg>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 14px; font-weight: 700; letter-spacing: -0.01em;">Arsenal</div>
      <div class="kick num" style="color: #5A6272; margin-top: 2px;">3rd · 26 pts · £48.5M</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(242,244,248,0.14); display: flex; align-items: center; justify-content: center; position: relative;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#98A1B4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H7l-3 3Z"></path></svg>
      <span style="position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #7DF9C4; border: 2px solid #08090F;"></span>
    </div>
  </div>

  <div style="padding: 26px 0 0; position: relative; z-index: 2;">
    <div class="kick" style="color: #5A6272; padding: 0 20px 10px;">The season · pull to move through it</div>

    <div style="display: flex; align-items: center; gap: 9px; padding: 0 0 0 6px; overflow: hidden;">
      <div style="width: 54px; flex-shrink: 0; opacity: 0.4; border-left: 1px solid rgba(242,244,248,0.12); padding-left: 9px; display: flex; flex-direction: column; gap: 4px;">
        <span class="kick num" style="font-size: 8px; color: #4E5566;">GW10</span>
        <span class="disp num" style="font-size: 13px; font-weight: 600; color: #98A1B4;">1—1</span>
      </div>
      <div style="width: 54px; flex-shrink: 0; opacity: 0.7; border-left: 1px solid rgba(242,244,248,0.12); padding-left: 9px; display: flex; flex-direction: column; gap: 4px;">
        <span class="kick num" style="font-size: 8px; color: #4E5566;">GW11</span>
        <span class="disp num" style="font-size: 13px; font-weight: 600; color: #FF6B7A;">0—2</span>
      </div>

      <div class="breathe" style="flex-grow: 1; min-width: 0; border-radius: 16px; border: 1px solid rgba(239,1,7,0.45); background: linear-gradient(160deg, rgba(239,1,7,0.16) 0%, rgba(242,244,248,0.035) 60%); padding: 15px 15px 16px; position: relative; overflow: hidden;">
        <div class="sweep" style="position: absolute; top: 0; left: 0; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(242,244,248,0.07), transparent); pointer-events: none;"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
          <span class="kick" style="color: #FF8A93;">Gameweek 12</span>
          <span class="kick num" style="color: #98A1B4;">Sat 15:00</span>
        </div>
        <div class="disp" style="font-size: 26px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05em;">Chelsea</div>
        <div style="font-size: 12px; color: #98A1B4; margin-top: 3px;">Emirates Stadium · 6th, 21 pts</div>
        <div style="display: flex; gap: 4px; margin-top: 13px;">
          <div style="height: 3px; width: 20px; border-radius: 2px; background: #FF6B7A;"></div>
          <div style="height: 3px; width: 20px; border-radius: 2px; background: #7DF9C4;"></div>
          <div style="height: 3px; width: 20px; border-radius: 2px; background: #7DF9C4;"></div>
          <div style="height: 3px; width: 20px; border-radius: 2px; background: #7DF9C4;"></div>
          <div style="height: 3px; width: 20px; border-radius: 2px; background: #5A6272;"></div>
        </div>
      </div>

      <div style="width: 42px; flex-shrink: 0; opacity: 0.35; border-left: 1px solid rgba(242,244,248,0.12); padding-left: 8px; display: flex; flex-direction: column; gap: 4px;">
        <span class="kick num" style="font-size: 8px; color: #4E5566;">GW13</span>
        <span style="font-size: 10px; color: #5A6272;">TOT</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px 0;">
      <div style="flex-grow: 1; height: 2px; border-radius: 2px; background: rgba(242,244,248,0.10); position: relative;">
        <div style="position: absolute; left: 0; top: 0; height: 2px; width: 31%; border-radius: 2px; background: #EF0107;"></div>
        <div style="position: absolute; left: 31%; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #F2F4F8; margin-left: -4px;"></div>
      </div>
      <span class="kick num" style="color: #5A6272;">12 / 38</span>
    </div>
  </div>

  <div style="padding: 22px 20px 0; position: relative; z-index: 2;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 11px; height: 62px; border-radius: 16px; background: #EF0107; color: #FFFFFF; box-shadow: 0 10px 34px rgba(239,1,7,0.36);">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      <span class="disp" style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em;">PLAY GAMEWEEK 12</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="position: relative; z-index: 2; padding: 0 12px;">
    <div style="border-radius: 22px 22px 0 0; border: 1px solid rgba(242,244,248,0.10); border-bottom: none; background: linear-gradient(180deg, #12141C 0%, #0C0E15 100%); padding: 12px 16px 0;">
      <div class="bob" style="width: 38px; height: 4px; border-radius: 3px; background: rgba(242,244,248,0.22); margin: 0 auto 14px;"></div>
      <div class="kick" style="color: #5A6272; padding-bottom: 11px;">Waiting on you · 2</div>
      <div style="display: flex; align-items: center; gap: 11px; padding-bottom: 12px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(125,249,196,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7DF9C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5 20.5 8 16 12.5"></path><path d="M3.5 8h17"></path><path d="M8 11.5 3.5 16 8 20.5"></path><path d="M20.5 16h-17"></path></svg>
        </span>
        <span style="font-size: 13.5px; font-weight: 500; flex-grow: 1;">Brighton bid <span class="num" style="color: #7DF9C4; font-weight: 700;">£22M</span> for Vieira</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#5A6272" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
      </div>
      <div style="height: 1px; background: rgba(242,244,248,0.07);"></div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 12px 0 14px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,107,122,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FF6B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"></path><path d="M12 16.5v.5"></path><path d="M10.3 3.2 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z"></path></svg>
        </span>
        <span style="font-size: 13.5px; font-weight: 500; flex-grow: 1;">Saliba is one booking from a ban</span>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#5A6272" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
      </div>
    </div>
  </div>

  <div style="position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 14px 26px 26px; background: #0C0E15; border-top: 1px solid rgba(242,244,248,0.07);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #EF0107;"></span><span class="kick" style="font-size: 8.5px; color: #F2F4F8;">Season</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #3B4150;"></span><span class="kick" style="font-size: 8.5px; color: #5A6272;">Squad</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #3B4150;"></span><span class="kick" style="font-size: 8.5px; color: #5A6272;">Table</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #3B4150;"></span><span class="kick" style="font-size: 8.5px; color: #5A6272;">Market</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;"><span style="width: 5px; height: 5px; border-radius: 50%; background: #3B4150;"></span><span class="kick" style="font-size: 8.5px; color: #5A6272;">Club</span></div>
  </div>

</div>
</x-dc>
</body>
</html>
