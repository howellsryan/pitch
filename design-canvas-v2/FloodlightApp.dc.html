<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0B120E; font-family: Barlow, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #F2A83B; } a:hover { color: #ECEFEA; }
    * { box-sizing: border-box; }
    .disp { font-family: Anton, "Arial Narrow", sans-serif; font-weight: 400; }
    .num { font-variant-numeric: tabular-nums; }
    .kick { font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0B120E; color: #ECEFEA; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; top: -140px; left: 50%; margin-left: -190px; width: 380px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(242,168,59,0.14) 0%, rgba(242,168,59,0) 70%); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 11px; padding: 16px 18px 12px; position: relative;">
    <svg viewBox="0 0 26 30" width="26" height="30" aria-hidden="true"><path d="M13 1 L24 5 V16 C24 23.5 18 27.5 13 29 C8 27.5 2 23.5 2 16 V5 Z" fill="#EF0107" stroke="rgba(236,239,234,0.3)" stroke-width="1"></path></svg>
    <div style="flex-grow: 1; min-width: 0;">
      <div class="disp" style="font-size: 19px; letter-spacing: 0.02em; line-height: 1.1em;">ARSENAL</div>
      <div class="kick num" style="color: #7C8A80; margin-top: 2px;">GW 12 / 38 · 3rd</div>
    </div>
    <div style="text-align: right;">
      <div class="kick" style="color: #7C8A80;">Budget</div>
      <div class="disp num" style="font-size: 18px; line-height: 1.1em; color: #F2A83B;">£48.5M</div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 6px 18px 0; display: flex; flex-direction: column; gap: 14px; position: relative;">

    <div style="border: 1px solid rgba(236,239,234,0.14); background: linear-gradient(180deg, rgba(242,168,59,0.08) 0%, rgba(236,239,234,0.03) 100%); padding: 16px 15px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="kick" style="color: #F2A83B;">Next match</span>
        <span class="kick num" style="color: #7C8A80;">Sat 15:00 · Emirates</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px;">
          <span class="disp" style="font-size: 27px;">ARS</span>
          <div style="display: flex; gap: 3px;">
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
            <div style="width: 15px; height: 3px; background: #7C8A80;"></div>
            <div style="width: 15px; height: 3px; background: #E4523F;"></div>
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
          </div>
        </div>
        <span class="kick" style="color: #5A6660;">VS</span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px;">
          <span class="disp" style="font-size: 27px; color: #A7B3AB;">CHE</span>
          <div style="display: flex; gap: 3px;">
            <div style="width: 15px; height: 3px; background: #E4523F;"></div>
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
            <div style="width: 15px; height: 3px; background: #38D07A;"></div>
            <div style="width: 15px; height: 3px; background: #7C8A80;"></div>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; background: #F2A83B; color: #0B120E;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        <span class="disp" style="font-size: 19px; letter-spacing: 0.03em;">PLAY MATCH</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px;">
      <div style="border: 1px solid rgba(236,239,234,0.12); padding: 10px 11px; display: flex; flex-direction: column; gap: 5px;">
        <span class="kick" style="color: #7C8A80;">Points</span>
        <span class="disp num" style="font-size: 22px;">26</span>
      </div>
      <div style="border: 1px solid rgba(236,239,234,0.12); padding: 10px 11px; display: flex; flex-direction: column; gap: 5px;">
        <span class="kick" style="color: #7C8A80;">Morale</span>
        <span class="disp" style="font-size: 22px; color: #38D07A;">HIGH</span>
      </div>
      <div style="border: 1px solid rgba(236,239,234,0.12); padding: 10px 11px; display: flex; flex-direction: column; gap: 5px;">
        <span class="kick" style="color: #7C8A80;">Board</span>
        <span class="disp" style="font-size: 22px; color: #F2A83B;">WATCH</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span class="kick" style="color: #7C8A80;">Waiting on you</span>
      <div style="display: flex; align-items: center; gap: 11px; border: 1px solid rgba(236,239,234,0.12); padding: 11px 12px;">
        <span style="width: 3px; height: 26px; background: #F2A83B; flex-shrink: 0;"></span>
        <span style="font-size: 13.5px; flex-grow: 1;">Brighton bid <span class="num" style="font-weight: 600; color: #F2A83B;">£22M</span> for Fábio Vieira</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; border: 1px solid rgba(236,239,234,0.12); padding: 11px 12px;">
        <span style="width: 3px; height: 26px; background: #E4523F; flex-shrink: 0;"></span>
        <span style="font-size: 13.5px; flex-grow: 1;">Saliba is one booking from a ban</span>
      </div>
    </div>

  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid rgba(236,239,234,0.12); background: rgba(11,18,14,0.96); padding-bottom: 22px; position: relative;">
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-top: 2px solid #F2A83B; margin-top: -1px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F2A83B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"></path></svg>
      <span class="kick" style="font-size: 8.5px; color: #F2A83B;">Home</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7C8A80" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"></circle><path d="M2.6 20a6.4 6.4 0 0 1 12.8 0"></path><path d="M17 5.2a3.4 3.4 0 0 1 0 6.6"></path></svg>
      <span class="kick" style="font-size: 8.5px; color: #7C8A80;">Squad</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7C8A80" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      <span class="kick" style="font-size: 8.5px; color: #7C8A80;">Table</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7C8A80" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5 20.5 8 16 12.5"></path><path d="M3.5 8h17"></path><path d="M8 11.5 3.5 16 8 20.5"></path><path d="M20.5 16h-17"></path></svg>
      <span class="kick" style="font-size: 8.5px; color: #7C8A80;">Market</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7C8A80" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v6a5 5 0 0 1-10 0Z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path><path d="M12 15v5"></path><path d="M9.5 20h5"></path></svg>
      <span class="kick" style="font-size: 8.5px; color: #7C8A80;">Club</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
