<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #FBF3E2; font-family: "Hanken Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #10695C; } a:hover { color: #2B1D12; }
    * { box-sizing: border-box; }
    .disp { font-family: "Bricolage Grotesque", "Hanken Grotesk", sans-serif; font-weight: 800; }
    .num { font-variant-numeric: tabular-nums; }
    .kick { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBF3E2; color: #2B1D12; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 15px 18px 11px;">
    <svg viewBox="0 0 24 28" width="24" height="28" aria-hidden="true"><path d="M12 1 L22 4.5 V15 C22 21.5 17 25.5 12 27 C7 25.5 2 21.5 2 15 V4.5 Z" fill="#EF0107" stroke="#2B1D12" stroke-width="1.6"></path></svg>
    <div style="flex-grow: 1; min-width: 0;">
      <div class="disp" style="font-size: 18px; letter-spacing: -0.02em; line-height: 1.1em;">ARSENAL</div>
      <div class="num" style="font-size: 11px; font-weight: 600; color: #7A6549;">GW 12 · 3rd · 26 pts</div>
    </div>
    <div style="border: 2px solid #2B1D12; border-radius: 999px; padding: 5px 11px; background: #FFFCF5;">
      <span class="num disp" style="font-size: 14px;">£48.5m</span>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 4px 18px 0; display: flex; flex-direction: column; gap: 13px;">

    <div style="border: 2.5px solid #2B1D12; border-radius: 18px; background: #FFFCF5; box-shadow: 5px 5px 0 #2B1D12; overflow: hidden;">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; background: #10695C; color: #FBF3E2; border-bottom: 2.5px solid #2B1D12;">
        <span class="kick">Next up</span>
        <span class="kick num">Sat 15:00 · Home</span>
      </div>
      <div style="padding: 15px 13px; display: flex; flex-direction: column; gap: 13px;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 14px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 92px;">
            <svg viewBox="0 0 24 28" width="30" height="35" aria-hidden="true"><path d="M12 1 L22 4.5 V15 C22 21.5 17 25.5 12 27 C7 25.5 2 21.5 2 15 V4.5 Z" fill="#EF0107" stroke="#2B1D12" stroke-width="1.6"></path></svg>
            <span class="disp" style="font-size: 13px;">ARS</span>
          </div>
          <span class="disp" style="font-size: 15px; color: #A8927A;">vs</span>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 92px;">
            <svg viewBox="0 0 24 28" width="30" height="35" aria-hidden="true"><path d="M12 1 L22 4.5 V15 C22 21.5 17 25.5 12 27 C7 25.5 2 21.5 2 15 V4.5 Z" fill="#034694" stroke="#2B1D12" stroke-width="1.6"></path></svg>
            <span class="disp" style="font-size: 13px;">CHE</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 54px; background: #D2452F; color: #FFFCF5; border: 2.5px solid #2B1D12; border-radius: 999px; font-size: 17px; font-weight: 700;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
          Kick off
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px;">
      <div style="border: 2px solid #2B1D12; border-radius: 14px; background: #FFFCF5; padding: 11px 12px; display: flex; flex-direction: column; gap: 5px;">
        <span class="kick" style="color: #7A6549;">Morale</span>
        <span class="disp" style="font-size: 21px; color: #10695C;">High</span>
      </div>
      <div style="border: 2px solid #2B1D12; border-radius: 14px; background: #FFFCF5; padding: 11px 12px; display: flex; flex-direction: column; gap: 5px;">
        <span class="kick" style="color: #7A6549;">The board</span>
        <span class="disp" style="font-size: 21px; color: #E3A11B;">Watching</span>
      </div>
    </div>

    <div style="border: 2px solid #2B1D12; border-radius: 14px; background: #FFFCF5; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <span class="kick" style="color: #7A6549;">In your inbox</span>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 26px; height: 26px; border-radius: 8px; background: #E3A11B; border: 1.6px solid #2B1D12; flex-shrink: 0;"></span>
        <span style="font-size: 13px; font-weight: 500; flex-grow: 1;">Brighton bid £22m for Fábio Vieira</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 26px; height: 26px; border-radius: 8px; background: #10695C; border: 1.6px solid #2B1D12; flex-shrink: 0;"></span>
        <span style="font-size: 13px; font-weight: 500; flex-grow: 1;">Youth intake: 4 new players in the academy</span>
      </div>
    </div>

  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 10px 12px 24px; background: #F3E8D0; border-top: 2.5px solid #2B1D12;">
    <div style="height: 50px; border-radius: 12px; background: #2B1D12; color: #FBF3E2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Home</span>
    </div>
    <div style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7A6549;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"></circle><path d="M2.6 20a6.4 6.4 0 0 1 12.8 0"></path><path d="M17 5.2a3.4 3.4 0 0 1 0 6.6"></path><path d="M18.4 14.6A5.6 5.6 0 0 1 21.4 20"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Squad</span>
    </div>
    <div style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7A6549;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Table</span>
    </div>
    <div style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7A6549;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5 20.5 8 16 12.5"></path><path d="M3.5 8h17"></path><path d="M8 11.5 3.5 16 8 20.5"></path><path d="M20.5 16h-17"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Market</span>
    </div>
    <div style="height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #7A6549;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v6a5 5 0 0 1-10 0Z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path><path d="M9.5 20h5"></path><path d="M12 15v5"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700;">Club</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
