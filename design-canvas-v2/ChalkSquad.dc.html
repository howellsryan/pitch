    body { margin: 0; background: #0C2718; font-family: "Familjen Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FF8A3D; } a:hover { color: #F4F1E8; }
    * { box-sizing: border-box; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .kick { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
    .chip { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .disc { width: 42px; height: 42px; border-radius: 50%; background: #F4F1E8; color: #0C2718; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
    @keyframes drawArrow { 0% { stroke-dashoffset: 150; opacity: 0; } 12% { opacity: 1; } 62% { stroke-dashoffset: 0; opacity: 1; } 88% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 150; opacity: 0; } }
    @keyframes discPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,61,0.5); } 60% { box-shadow: 0 0 0 12px rgba(255,138,61,0); } }
    .arrow { stroke-dasharray: 150; animation: drawArrow 5.5s ease-in-out infinite; }
    .selected { animation: discPulse 2.4s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</helmet>
