<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PITCH — Football Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root{
  /* Kickoff (R0) — docs/plan/07-redesign.md.
     These literals are the SOURCE OF TRUTH for the legacy build path.
     src/build.py assembles this file into index.html for validate.js, and that
     artifact never sees src/app.css — so tokens defined only in the @theme
     block would resolve to nothing here and the whole page would render
     unstyled. app.css mirrors these values for the Vite app and for Tailwind
     utility generation; validate.js asserts the two agree, because a silent
     drift between them is invisible until someone opens the legacy page. */
  --color-ground:#070D0A;--color-surface:#0E1712;--color-raised:#16211B;--color-raised-2:#1E2B24;
  --color-line:rgba(236,240,234,0.09);
  --color-tx:#ECF0EA;--color-tx-2:#93A398;--color-tx-3:#64756A;
  --color-club:#EF0107;--color-on-club:#FFFFFF;
  --color-accent:#FFE14D;--color-on-accent:#070D0A;
  --color-live:#34E27A;--color-warn:#FF8A3D;--color-bad:#FF5A6E;

  /* Legacy shell chrome — sidebar, new-game screen, toasts — aliases the
     tokens above rather than carrying a second palette. These die with R1/R2,
     which replace the surfaces that use them. */
  --night:var(--color-ground);--sur:var(--color-surface);--sur2:var(--color-raised);--sur3:var(--color-raised-2);
  --bdr:var(--color-line);--bdr-a:rgba(255,225,77,0.4);
  --tx:var(--color-tx);--tx2:var(--color-tx-2);--txd:var(--color-tx-3);
  /* --acc and --glow are overwritten at runtime by theme.mjs with the club
     colour; the literals are pre-save fallbacks only. --acc2 keeps its legacy
     WARN meaning and maps to --color-warn — mapping it to --color-accent would
     paint warning toasts and the EOY banner in the reserved action yellow. */
  --acc:var(--color-club);--acc2:var(--color-warn);--acc3:var(--color-bad);
  --glow:rgba(255,225,77,0.12);
  --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --font-body:'Familjen Grotesk',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --fd:var(--font-display);--fb:var(--font-body);--fm:var(--font-mono);
  --nav:72px;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--tx);font-family:var(--fb);overflow:hidden;display:flex}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");pointer-events:none;z-index:50;opacity:.4}

/* ── NEW GAME ── */
#ng{position:fixed;inset:0;z-index:1000;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto;overflow-x:hidden;gap:0}
.ng-logo{font-family:var(--fd);font-size:clamp(52px,12vw,88px);color:var(--acc);letter-spacing:8px;margin-bottom:4px;line-height:1}
.ng-sub{font-family:var(--fm);font-size:11px;color:var(--tx2);letter-spacing:3px;text-transform:uppercase;margin-bottom:28px}
.ng-label{font-family:var(--fd);font-size:clamp(20px,4vw,26px);letter-spacing:1px;margin-bottom:14px;text-align:center}
.ng-filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;margin-bottom:14px;padding:4px 8px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;max-width:520px;align-self:stretch;box-sizing:border-box;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.ng-filters::-webkit-scrollbar{display:none}
.ng-f{display:inline-flex;align-items:center;height:44px;padding:0 14px;border-radius:22px;font-size:12px;font-weight:500;line-height:1;cursor:pointer;transition:all .15s;color:var(--tx2);border:1px solid var(--bdr);background:transparent;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;scroll-snap-align:start;box-sizing:border-box}
.ng-f.on{background:var(--glow);color:var(--acc);border-color:var(--bdr-a)}
#team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:1100px;padding:4px}
.team-card{background:var(--sur);border:2px solid var(--bdr);border-radius:12px;padding:14px 10px;cursor:pointer;transition:all .2s;text-align:center;-webkit-tap-highlight-color:transparent}
.team-card:hover{border-color:var(--acc);background:var(--sur2)}
.team-card.sel{border-color:var(--acc);background:var(--glow);box-shadow:0 0 0 2px var(--acc)}
.tc-crest{font-size:26px;margin-bottom:6px}
.tc-name{font-weight:600;font-size:12px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-rep{font-size:10px;color:var(--tx2)}
.tc-budget{font-family:var(--fm);font-size:11px;color:var(--acc2);margin-top:2px}
.ng-start{margin-top:20px}
#btn-start{padding:14px 44px;border-radius:10px;border:none;background:var(--acc);color:white;font-family:var(--fb);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
#btn-start:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
#btn-start:disabled{opacity:.5;cursor:not-allowed}

/* ── SIDEBAR ── */
.sidebar{width:var(--nav);background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;position:fixed;left:0;top:0;bottom:0;z-index:100}
.logo{font-family:var(--fd);font-size:24px;color:var(--acc);letter-spacing:2px;margin-bottom:22px;position:relative}
.logo::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--acc);border-radius:2px}
.nav-item{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .2s;color:var(--txd);-webkit-tap-highlight-color:transparent}
.nav-item:hover{color:var(--tx);background:var(--sur2)}
.nav-item.active{color:var(--acc);background:var(--glow);border:1px solid var(--bdr-a);animation:pulse 2s ease infinite}
.nav-item svg{width:21px;height:21px}
.nav-item .tip{position:absolute;left:calc(100% + 10px);background:var(--sur3);color:var(--tx);font-family:var(--fb);font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:all .2s;border:1px solid var(--bdr);z-index:200}
.nav-item:hover .tip{opacity:1;transform:translateX(0)}
.nav-spc{flex:1}
.nav-sep{width:28px;height:1px;background:var(--bdr);margin:4px 0;flex-shrink:0}
.mgr-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--color-raised-2),var(--acc));display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:16px;color:white;border:2px solid var(--bdr-a);margin-top:8px;cursor:pointer}

/* ── BOTTOM NAV (mobile) ── */
.bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--sur);border-top:1px solid var(--bdr);padding:6px 0 env(safe-area-inset-bottom,4px)}
.bot-nav-inner{display:flex;align-items:center}
.bn{display:flex;flex:1 1 0;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 2px;min-height:44px;color:var(--txd);transition:color .15s;background:none;border:none;-webkit-tap-highlight-color:transparent}
.bn.play-btn{flex:0 0 auto}
.bn.active{color:var(--acc)}
.bn svg{width:20px;height:20px}
.bn span{font-size:11px;font-family:var(--fm);letter-spacing:.5px}

/* ── MAIN ── */
#app{display:flex;width:100%;height:100%}
.main{margin-left:var(--nav);flex:1;height:100vh;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .3s ease,transform .3s var(--ease);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0)}
.screen#screen-academy,.screen#screen-tactics,.screen#screen-trophies,.screen#screen-settings,.screen#screen-transfers,.screen#screen-competitions,.screen#screen-inbox{overflow:hidden;display:flex;flex-direction:column}
.screen::-webkit-scrollbar{width:3px}
.screen::-webkit-scrollbar-thumb{background:var(--sur3);border-radius:3px}


/* ── PAGE HEADER ── */
.ph{padding:18px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ph-left .pl{font-family:var(--fm);font-size:10px;color:var(--acc);letter-spacing:3px;text-transform:uppercase;margin-bottom:3px}
.ph-left .pt{font-family:var(--fd);font-size:clamp(30px,5vw,40px);line-height:1;letter-spacing:1px}
.ph-left-actions{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ── CARDS & SHARED ── */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:14px}
.card-p{padding:18px 20px}
.no-data{font-size:12px;color:var(--txd);padding:20px;text-align:center}

/* ── POSITION BADGES ── */
.pos{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-family:var(--fm);font-weight:700;letter-spacing:.5px}
.pos.ATT{background:rgba(232,72,85,.2);color:var(--acc3)}
.pos.MID{background:rgba(245,200,66,.15);color:var(--acc2)}
.pos.DEF{background:rgba(52,226,122,.15);color:var(--color-live)}
.pos.GK{background:rgba(124,131,232,.15);color:#7c83e8}

/* ── FORM BADGES ── */
.fb{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-family:var(--fm);font-weight:700}
.fb.hot{background:rgba(232,72,85,.2);color:var(--acc3)}
.fb.good{background:rgba(52,226,122,.2);color:var(--color-live)}
.fb.avg{background:rgba(245,200,66,.15);color:var(--acc2)}

/* ── BTNS ── */
.btn{padding:10px 18px;border-radius:9px;font-family:var(--fb);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;letter-spacing:.3px;-webkit-tap-highlight-color:transparent}
.btn-p{background:var(--acc);color:var(--color-on-club)}.btn-p:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn-s{background:transparent;color:var(--tx);border:1px solid var(--bdr)}.btn-s:hover{border-color:var(--tx2)}
.btn-d{background:rgba(232,72,85,.1);color:var(--acc3);border:1px solid rgba(232,72,85,.3)}.btn-d:hover{background:rgba(232,72,85,.2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── HOME ── */
/* Rebuilt as src/lib/ui/HomeScreen.svelte (Phase 4,
   docs/plan/04-migration-phases.md) — its styles are scoped in the
   component itself, so this legacy block is gone rather than left dead. */

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--sur3);border-radius:2px;cursor:pointer;outline:none;touch-action:pan-y;vertical-align:middle}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 0 0 3px var(--glow);transition:transform .1s;margin-top:-8px}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);cursor:pointer;box-shadow:0 0 0 3px var(--glow);border:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px}

/* ── COMPETITIONS ── */
.comp-layout{display:grid;grid-template-columns:1fr 320px;gap:13px;flex:1;min-height:0;padding:0 20px 12px}
.comp-tbl{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.comp-ph{padding:12px 18px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.comp-inn{padding:8px;flex:1;min-height:0;overflow-y:auto}
.res-side{background:var(--sur);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.res-list{flex:1;min-height:0;overflow-y:auto;padding:4px}
.comp-pt{font-family:var(--fd);font-size:18px;letter-spacing:1px}
.full-hdr{display:grid;grid-template-columns:24px 1fr 28px 24px 24px 24px 24px 24px 32px 32px 70px;gap:3px;font-size:9px;color:var(--txd);font-family:var(--fm);letter-spacing:.5px;padding:0 5px;margin-bottom:5px}
.full-row{display:grid;grid-template-columns:24px 1fr 28px 24px 24px 24px 24px 24px 32px 32px 70px;gap:3px;padding:7px 5px;border-radius:7px;font-size:11px;align-items:center;transition:background .15s}
.full-row:hover{background:var(--sur2)}
.full-row.hl{background:var(--glow);border:1px solid var(--bdr-a)}
.full-row.hl .tc{color:var(--acc);font-weight:600}
.form-mini{display:flex;gap:2px}
.fdot{width:15px;height:15px;border-radius:3px;font-size:8px;font-family:var(--fm);display:flex;align-items:center;justify-content:center;font-weight:700}
.fd-W{background:rgba(52,226,122,.2);color:var(--color-live)}
.fd-D{background:rgba(245,200,66,.15);color:var(--acc2)}
.fd-L{background:rgba(232,72,85,.15);color:var(--acc3)}
.res-row{padding:9px 13px;border-radius:7px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.res-row:hover{background:var(--sur2)}
.res-row.ur{background:var(--glow);border:1px solid var(--bdr-a)}
.res-gw{font-size:9px;color:var(--txd);font-family:var(--fm);margin-bottom:3px}
.res-teams{display:flex;align-items:center;gap:6px;font-size:12px}
.rth{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rta{flex:1;text-align:right;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsc{font-family:var(--fd);font-size:15px;letter-spacing:2px;min-width:42px;text-align:center;flex-shrink:0}
.res-date{font-size:10px;color:var(--txd);font-family:var(--fm);margin-top:2px}


/* ── SQUAD — compact desktop table ── */
.inj-badge{background:rgba(232,72,85,.2);color:var(--acc3);padding:0 3px;border-radius:2px;font-size:8px;font-family:var(--fm)}
.listed-badge{background:rgba(245,200,66,.2);color:var(--acc2);border:1px solid rgba(245,200,66,.4);padding:0 4px;border-radius:3px;font-size:8px;font-family:var(--fm)}
/* Player detail modal */
.sq-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sq-modal-stat{background:var(--sur2);border-radius:8px;padding:10px 12px}
.sq-modal-stat-lbl{font-size:9px;font-family:var(--fm);color:var(--txd);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.sq-modal-stat-val{font-family:var(--fd);font-size:22px;line-height:1}
.sq-modal-stat-sub{font-size:10px;color:var(--tx2);margin-top:2px}
.sq-attr-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.sq-attr-row:last-child{border-bottom:none}
.sq-attr-lbl{font-size:11px;color:var(--tx2);width:100px;flex-shrink:0}
.sq-attr-bar-w{flex:1;height:4px;background:var(--sur3);border-radius:2px;overflow:hidden}
.sq-attr-bar{height:100%;border-radius:2px}
.sq-attr-val{font-family:var(--fm);font-size:11px;font-weight:700;width:24px;text-align:right;flex-shrink:0}

/* ── MODAL ── */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10000;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s;padding:0}
.modal-bd.open{opacity:1}
.modal{background:var(--sur);border:1px solid var(--bdr);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s var(--ease)}
.modal-bd.open .modal{transform:translateY(0)}
/* Wide variant — centred, taller, constrained. Only remaining caller is
   squad_tactics_offers.js's Offers modal (showModal(..., {wide:true})); the
   live-match modal that originally justified this stopped using showModal()
   entirely in Phase 5 (docs/plan/04-migration-phases.md) — MatchScreen.svelte
   is a route, not a modal. */
.modal-wide{align-items:center;padding:24px 16px}
.modal-xl{border-radius:16px;max-width:800px;width:100%;max-height:88vh;height:88vh;transform:translateY(30px) scale(.97);transition:transform .3s var(--ease),opacity .25s}
.modal-bd.open .modal-xl{transform:translateY(0) scale(1)}
.modal-xl .modal-body{padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.modal-bd.open .modal{transform:translateY(0)}
.modal-drag{width:40px;height:4px;background:var(--sur3);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-family:var(--fd);font-size:20px;letter-spacing:1px}
.modal-x{background:none;border:none;color:var(--txd);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:5px}
.modal-x:hover{color:var(--tx);background:var(--sur2)}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-foot .btn{padding:9px 18px}
.ctr{display:flex;flex-direction:column;gap:10px}
.ctr-pl{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.ctr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.ctr-row:last-of-type{border-bottom:none}
/* ── Inbox ── */
.inbox-tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--bdr);scrollbar-width:none}
.inbox-tabs::-webkit-scrollbar{display:none}
.inbox-tab{padding:5px 13px;border-radius:99px;font-size:11px;font-family:var(--fm);cursor:pointer;white-space:nowrap;border:1px solid var(--bdr);color:var(--tx2);background:var(--sur2);transition:all .15s}
.inbox-tab.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.inbox-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.inbox-item{display:flex;gap:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;padding:11px 12px;transition:background .15s}
.inbox-item:not(.read){border-color:var(--bdr-a);background:rgba(255,225,77,.05)}
.inbox-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.inbox-content{flex:1;min-width:0}
.inbox-header{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px}
.inbox-title{font-size:13px;font-weight:600;color:var(--tx);line-height:1.3}
.inbox-time{font-size:10px;color:var(--txd);font-family:var(--fm);white-space:nowrap;flex-shrink:0;margin-top:1px}
.inbox-body{font-size:11px;color:var(--tx2);line-height:1.4}
.inbox-meta{font-size:10px;color:var(--txd);font-family:var(--fm);margin-top:3px}
.inbox-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:60px 20px;text-align:center}
.inbox-empty-title{font-family:var(--fd);font-size:18px;letter-spacing:1px}
.inbox-empty-sub{font-size:12px;color:var(--tx2);max-width:220px;line-height:1.5}
.nav-badge{position:absolute;top:5px;right:5px;background:var(--acc3);color:#fff;font-size:9px;font-family:var(--fm);font-weight:700;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 3px}
.bn-badge{position:absolute;top:2px;right:8px;background:var(--acc3);color:#fff;font-size:9px;font-family:var(--fm);font-weight:700;min-width:15px;height:15px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 3px}
.gw-results{display:flex;flex-direction:column;gap:4px}
.gwr{padding:10px 13px;border-radius:8px;background:var(--sur2)}
.gwr.ur{background:var(--glow);border:1px solid var(--bdr-a)}
.gwr-teams{display:flex;align-items:center;gap:8px;font-size:13px}
.gwr-h{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gwr-a{flex:1;text-align:right;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gwr-scorers .aw{text-align:right}
.cup-result-modal{background:var(--sur2);border-radius:10px;padding:14px;margin-top:8px}
.cup-result-modal.won{border-left:3px solid var(--acc)}
.cup-result-modal.lost{border-left:3px solid var(--acc3)}

/* ── TOAST ── */
.toast-container{position:fixed;bottom:72px;right:14px;z-index:600;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:320px}
.toast{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:500;background:var(--sur3);border:1px solid var(--bdr);box-shadow:0 4px 20px rgba(0,0,0,.4);transform:translateY(6px);opacity:0;transition:all .25s ease;pointer-events:all}
.toast.vis{transform:translateY(0);opacity:1}
.toast-success{border-color:var(--acc)}.toast-error{border-color:var(--acc3)}.toast-info{border-color:var(--bdr-a)}.toast-warning{border-color:var(--acc2)}
.toast-icon{font-size:14px;flex-shrink:0}
.toast-success .toast-icon{color:var(--acc)}.toast-error .toast-icon{color:var(--acc3)}.toast-info .toast-icon{color:#7c83e8}.toast-warning .toast-icon{color:var(--acc2)}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:rgba(8,12,16,.85);z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#loader.vis{opacity:1;pointer-events:all}
.loader-spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--sur3);border-top-color:var(--acc);animation:spin .7s linear infinite;margin:0 auto 14px}
.loader-msg{font-family:var(--fm);font-size:11px;color:var(--tx2);letter-spacing:2px;text-align:center}

/* ── SEASON END ── */
.eoy-banner{background:linear-gradient(135deg,rgba(255,138,61,.15),rgba(52,226,122,.1));border:1px solid var(--acc2);border-radius:14px;padding:18px 20px;text-align:center}
.eoy-banner .eoy-icon{font-size:40px;margin-bottom:8px}
.eoy-banner .eoy-title{font-family:var(--fd);font-size:28px;letter-spacing:1px;color:var(--acc2);margin-bottom:6px}
.eoy-banner .eoy-desc{font-size:13px;color:var(--tx2);margin-bottom:14px}

/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,225,77,.3)}50%{box-shadow:0 0 0 4px rgba(255,225,77,.1)}}
.comp-layout>*{animation:sUp .35s ease both}

  .full-row>*:nth-child(4),.full-row>*:nth-child(5),.full-row>*:nth-child(6),
  .full-row>*:nth-child(7),.full-row>*:nth-child(8),.full-row>*:nth-child(9){display:none}
  .form-mini{display:flex;gap:3px;justify-content:flex-end;flex-wrap:nowrap}
  .fdot{width:14px;height:14px;font-size:7px}
}
@media(max-width:480px){
