name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and PR. Both build paths are exercised: build.py's
  # concatenation (which runs validate.js's compatibility suite) and the Vite
  # build, plus lint, Vitest, the club-accent contrast floor, and Playwright
  # career journeys.
  #
  # This workflow does NOT deploy. Cloudflare Workers Builds is connected to
  # this repo and owns both production deploys and per-branch previews —
  # having both systems deploy the same Worker races them against each other.
  # Its build command is `npm ci && npm run build:app`, which deliberately
  # skips build:legacy: that path exists only to feed validate.js, it is
  # gated here, and it needs python3 in the build image.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The legacy concatenation path bundles and runs validate.js. It remains
      # the gate nothing bypasses; stochastic outcome sampling is excluded.
      - run: npm run build:legacy

      # The Vite path: real ES modules, the deployed app.
      - run: npm run build:app
      - run: npm run lint
      - run: npm run test
      - run: npm run check:accents

      # A passing Vite build proves the module graph resolves, not that it is
      # complete — a missing import only surfaces when the code path runs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # P0–P3 and shell-polish work changed mobile surfaces. Retain the exact
      # Playwright states used for completion review so layout is verified from
      # rendered evidence, not inferred from component CSS.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-career-menu-mobile
          path: test-results/p0-career-menu-390x844.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-competitions-mobile
          path: test-results/p1-competitions-390x844.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-top-navigation-squad
          path: test-results/mobile-top-nav-squad-390x844.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-squad-tactics-mobile
          path: test-results/p2-squad-tactics-390x844.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-team-news-mobile
          path: test-results/p2-team-news-390x844.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-responsive-wide
          path: |
            test-results/p2-squad-tactics-1280x800.png
            test-results/p2-team-news-1280x800.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-player-model-responsive
          path: |
            test-results/p3-player-detail-390x844.png
            test-results/p3-player-detail-1280x800.png
          if-no-files-found: error
          retention-days: 7

      # Kept for debugging — the legacy single-file build, downloadable from
      # the run. Nothing deploys from it.
      - uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: index.html
          retention-days: 7
