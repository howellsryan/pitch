name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and PR. Both build paths are exercised: build.py's
  # concatenation (which runs validate.js's 1180 checks) and the Vite build,
  # plus lint, the club-accent contrast floor, and a Playwright career smoke
  # test.
  #
  # This workflow does NOT deploy. Cloudflare Workers Builds is connected to
  # this repo and owns both production deploys and per-branch previews —
  # having both systems deploy the same Worker races them against each other.
  # Its build command is `npm ci && npm run build:app`, which deliberately
  # skips build:legacy: that path exists only to feed validate.js, it is
  # gated here, and it needs python3 in the build image.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The legacy concatenation path: bundles and runs validate.js's 1180
      # checks. Still the gate nothing bypasses.
      # NOTE: the "Home win rate >20% over 30 games" check is stochastic and
      # fails roughly 1 run in 8 independently of the change under test.
      - run: npm run build:legacy

      # The Vite path: real ES modules, the app that Phase 3 builds on.
      - run: npm run build:app
      - run: npm run lint
      - run: npm run check:accents

      # A passing Vite build proves the module graph resolves, not that it is
      # complete — a missing import only surfaces when the code path runs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Kept for debugging — the legacy single-file build, downloadable from
      # the run. Nothing deploys from it.
      - uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: index.html
          retention-days: 7
