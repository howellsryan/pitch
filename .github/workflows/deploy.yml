name: Build, validate, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and PR. Both build paths are exercised: build.py's
  # concatenation (which runs validate.js's 1180 checks) and the Vite build,
  # plus lint, the club-accent contrast floor, and a Playwright career smoke
  # test. Deploy still ships the legacy index.html — switching the Worker to
  # dist/ is a separate, deliberate step.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The legacy concatenation path: bundles and runs validate.js's 1180
      # checks. Still the gate nothing bypasses.
      # NOTE: the "Home win rate >20% over 30 games" check is stochastic and
      # fails roughly 1 run in 8 independently of the change under test.
      - run: npm run build:legacy

      # The Vite path: real ES modules, the app that Phase 3 builds on.
      - run: npm run build:app
      - run: npm run lint
      - run: npm run check:accents

      # A passing Vite build proves the module graph resolves, not that it is
      # complete — a missing import only surfaces when the code path runs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: index.html
          retention-days: 7

  # Pushes to main go live at pitch-sim.com (once the custom domain is
  # attached — see docs/plan/03-cloudflare-workers.md, Phase 0).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: index.html
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Every other push and PR gets its own preview URL, without touching
  # production traffic. Open it on a phone before merging.
  preview:
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: index.html
      - run: npx wrangler@4 versions upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
