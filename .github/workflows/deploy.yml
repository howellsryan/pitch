name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and PR. Vite is the only application build: it produces
  # the same dist/ artifact Cloudflare Workers Builds deploys. Verification then
  # runs lint, deterministic Vitest/contracts, match-balance guardrails and the
  # club-accent contrast floor.
  #
  # There is deliberately no browser/E2E job here, and no E2E suite in the
  # repository: Playwright, its config and its opt-in workflow were removed
  # because they cost more to run and maintain than they caught. Do not add one
  # back. Browser behaviour is verified by driving the running app by hand.
  #
  # This workflow does NOT deploy. Cloudflare Workers Builds is connected to
  # this repo and owns both production deploys and per-branch previews —
  # having both systems deploy the same Worker races them against each other.
  # Its build command is `npm ci && npm run build:app` and it serves `dist/`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The canonical Vite/Svelte production build.
      - run: npm run build
      - run: npm run lint
      - run: npm run test

      # T7 deep calibration remains separate from the unchanged fast balance
      # gate inside npm test. The final reviewed matrix uses 100 paired seeds
      # across all 25 scenarios (5,000 authoritative simulations) and the
      # reviewed T7.2 structural guardrails are asserted against that exact run.
      - run: npm run balance:match:deep:check

      - run: npm run check:accents

      # Keep the actual production artifact for debugging failed deployments.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
