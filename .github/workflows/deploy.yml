name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and PR. Both build paths are exercised: build.py's
  # concatenation (which runs validate.js's compatibility suite) and the Vite
  # build, plus lint, Vitest, and the club-accent contrast floor.
  #
  # There is deliberately no browser/E2E job here, and no E2E suite in the
  # repository: Playwright, its config and its opt-in workflow were removed
  # because they cost more to run and maintain than they caught. Do not add one
  # back. Browser behaviour is verified by driving the running app by hand.
  #
  # This workflow does NOT deploy. Cloudflare Workers Builds is connected to
  # this repo and owns both production deploys and per-branch previews —
  # having both systems deploy the same Worker races them against each other.
  # Its build command is `npm ci && npm run build:app`, which deliberately
  # skips build:legacy: that path exists only to feed validate.js, it is
  # gated here, and it needs python3 in the build image.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The legacy concatenation path bundles and runs validate.js. It remains
      # the gate nothing bypasses; stochastic outcome sampling is excluded.
      - run: npm run build:legacy

      # The Vite path: real ES modules, the deployed app.
      - run: npm run build:app
      - run: npm run lint
      - run: npm run test

      # T7 deep calibration remains separate from the unchanged fast balance
      # gate inside npm test. The final reviewed matrix uses 100 paired seeds
      # across all 25 scenarios (5,000 authoritative simulations) and the
      # reviewed T7.2 structural guardrails are asserted against that exact run.
      - run: npm run balance:match:deep:check

      - run: npm run check:accents

      # Kept for debugging — the legacy single-file build, downloadable from
      # the run. Nothing deploys from it.
      - uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: index.html
          retention-days: 7
