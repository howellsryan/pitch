name: Reconcile T7 with current main

on:
  push:
    branches:
      - scratch/t7-balance-rollout
    paths:
      - .github/workflows/reconcile-t7-main.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/t7-balance-rollout
          fetch-depth: 0

      - name: Merge current main and resolve reviewed overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"

          set +e
          git merge --no-ff --no-commit origin/main
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts to reconcile:\n%s\n' "${CONFLICTS[*]}"

            allowed() {
              case "$1" in
                CLAUDE.md|src/lib/ui/MatchScreen.svelte|src/modules/managerTactics.js|src/modules/matchEngine.js|src/modules/save.js|src/modules/scouting.js|src/modules/scoutingView.js|src/modules/squadPlanning.js|src/modules/transferMarket.js) return 0 ;;
                *) return 1 ;;
              esac
            }

            for file in "${CONFLICTS[@]}"; do
              if ! allowed "$file"; then
                echo "Unexpected merge conflict: $file" >&2
                exit 1
              fi
              # Scratch already contains reviewed semantic reconciliations for the
              # T7-heavy overlaps. Start from that reviewed version rather than
              # accepting conflict markers or silently choosing current main.
              git checkout --ours -- "$file"
              git add -- "$file"
            done

            # These four current-main deltas had not yet been promoted into the
            # T7 scratch tree. Apply the exact main patch onto the reviewed T7
            # version with git's three-way machinery. Any unresolved overlap
            # fails this job instead of committing an invented resolution.
            for file in CLAUDE.md src/lib/ui/MatchScreen.svelte src/modules/squadPlanning.js src/modules/transferMarket.js; do
              if printf '%s\n' "${CONFLICTS[@]}" | grep -Fxq "$file"; then
                git diff "$BASE" origin/main -- "$file" > /tmp/main-delta.patch
                if [ -s /tmp/main-delta.patch ]; then
                  git apply --3way --index /tmp/main-delta.patch
                fi
              fi
            done
          fi

          # Semantic assertions for both sides of the reconciliation. These are
          # intentionally specific enough to fail if a reviewed contract vanished.
          grep -Fq "validateMatchSimulationVersion" src/modules/matchEngine.js
          grep -Fq "buildScoutingTacticalAssessment" src/modules/scouting.js
          grep -Fq "buildCareerTacticalContext" src/modules/squadPlanning.js
          grep -Fq "evaluateCareerTacticalFit" src/modules/transferMarket.js
          grep -Fq "managedBuyerOwnsPersonalTerms" src/modules/transferMarket.js
          grep -Fq "homeBench:inputs.homeBench" src/lib/ui/MatchScreen.svelte
          grep -Fq "### Matchday squad: XI, bench, reserves" CLAUDE.md
          grep -Fq "Current Broadcast consumes each authoritative action-ledger phase" CLAUDE.md
          if grep -Fq "buyer_squad_full" src/modules/squadPlanning.js; then
            echo "Legacy buyer squad-size ceiling survived reconciliation" >&2
            exit 1
          fi

          git status --short
          git commit -m "merge: reconcile current main into T7"
          git push origin HEAD:scratch/t7-balance-rollout
