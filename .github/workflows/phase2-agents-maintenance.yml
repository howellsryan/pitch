name: Phase 2 contributor guide maintenance

on:
  push:
    branches:
      - feat/playable-key-moments-mvp

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playable-key-moments-mvp
          fetch-depth: 0

      - name: Record Play Key Moments product and architecture boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text()

          old = "- **Product:** free browser-first football career simulator, 9 leagues / 186 clubs, mobile-first, no forced account. It is **simulator-only**: do not add manual/on-pitch football controls. Broadcast is a watchable presentation of simulated football, not a playable match mode."
          new = "- **Product:** free browser-first football career simulator, 9 leagues / 186 clubs, mobile-first, no forced account. Career simulation remains core. Do **not** add continuous/manual 11v11 control or a second match engine. **Play Key Moments** is the only bounded on-pitch interaction programme and must resolve through the authoritative match engine; Broadcast remains presentation-only."
          if text.count(old) != 1:
              raise SystemExit('Expected one product-boundary line')
          text = text.replace(old, new, 1)

          anchor = "- P1 background fixtures also use the authoritative fast match engine. Never run Broadcast simulation for the background world.\n\n\n### Match simulation versioning and T7 balance gate"
          insertion = """- P1 background fixtures also use the authoritative fast match engine. Never run Broadcast simulation for the background world.\n\n### Play Key Moments — bounded authoritative continuation\n\n- `docs/plan/playable-key-moments-roadmap.md` is authoritative for the Play Key Moments programme. Phase 1 proves the prepare/resolve seam and 3D presentation; Phase 2 is limited to career-integrated open-play finishing and goalkeeper decisions.\n- `src/modules/playableMomentsCareer.js` owns the versioned persisted session, pre-finish eligibility/pacing, JSON-safe continuation shape and compact receipts. `src/modules/playableMomentsPersistence.js` owns compare-and-swap writes to the **existing active save row**. `src/modules/playableMomentsRuntime.js` coordinates prepare, durable commit, acknowledgement and ready-to-close state. Do not create a parallel database, fixture queue or match lifecycle.\n- A pending moment must be persisted before input is accepted. The renderer returns normalized intent only; `matchEngine.js` remains authoritative for the resulting football. A committed result stays durable until acknowledged so refresh cannot reroll or skip the reveal.\n- `MatchScreen.svelte` owns orchestration and still finalises through `advanceOneFixtureWithResult()`. The playable session is cleared only after that existing fixture/world closeout succeeds. Quick Sim and Watch Match remain independent automatic paths.\n- Renderer/asset failure must fall back to automatic resolution of the **same saved pending moment**, never start a new seed or reinterpret an already-started simulation version.\n\n### Match simulation versioning and T7 balance gate"""
          if text.count(anchor) != 1:
              raise SystemExit('Expected one authoritative-football anchor')
          text = text.replace(anchor, insertion, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/phase2-agents-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "Document Play Key Moments product boundary"
          git push origin HEAD:feat/playable-key-moments-mvp
