name: Opt-in E2E verification

on:
  workflow_dispatch:
  push:
    paths:
      - .github/e2e-trigger

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Diagnostic only: keep function names readable for the CPU profiler.
      # The normal Build and validate workflow still uses the production build.
      - run: node tools/make-entry.mjs && npx vite build --minify=false
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/p1-living-world-performance.spec.mjs --config=playwright.config.mjs
