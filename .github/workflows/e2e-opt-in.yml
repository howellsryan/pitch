name: Opt-in E2E verification

on:
  workflow_dispatch:
  push:
    paths:
      - .github/e2e-trigger

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - run: npx playwright install --with-deps chromium
      # Opt-in runs are deliberately narrow while P3 is closing out. The
      # normal Build and validate workflow never installs/runs Playwright.
      - run: npx playwright test tests/p1-living-world-performance.spec.mjs --config=playwright.config.mjs
