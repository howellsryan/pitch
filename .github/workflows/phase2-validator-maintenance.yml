name: Phase 2 validator maintenance

on:
  push:
    branches:
      - feat/playable-key-moments-mvp

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playable-key-moments-mvp
          fetch-depth: 0

      - name: Align legacy validator with shared match lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/validate.js')
          text = path.read_text()

          replacements = [
              (
                  "chk('Kick Off action', matchScreenSrc.includes('Kick Off') && matchScreenSrc.includes('function startWatch'));",
                  "chk('Watch Match action', matchScreenSrc.includes('Watch Match') && matchScreenSrc.includes('function startWatch'));\nchk('Play Key Moments action', matchScreenSrc.includes('Play Key Moments') && matchScreenSrc.includes('function startPlayableKeyMoments'));",
              ),
              (
                  "// --- REG-2: When user is AWAY, startWatch() must pass userPlayers correctly ---\n// This tests the code path, not the async function. ui/prematch.js's\n// _launchWatchMatch became MatchScreen.svelte's resolveMatchTeams()/\n// startWatch() (Phase 5, docs/plan/04-migration-phases.md) — check that\n// source instead. We verify the source code resolves userPlayers/oppPlayers\n// based on resolved.userIsHome, not hardcoded to the home side.\nconst launchSrc = (()=>{\n  const start=matchScreenSrc.indexOf('async function startWatch');\n  if(start===-1) return '';\n  return matchScreenSrc.slice(start, start+3000);\n})();\nchk('REG: startWatch resolves userPlayers from resolved.userIsHome', launchSrc.includes('userPlayers: resolved.userIsHome ? resolved.homePlayers : resolved.awayPlayers'));\nchk('REG: startWatch resolves oppPlayers from resolved.userIsHome', launchSrc.includes('oppPlayers:  resolved.userIsHome ? resolved.awayPlayers : resolved.homePlayers') || launchSrc.includes('oppPlayers: resolved.userIsHome ? resolved.awayPlayers : resolved.homePlayers'));",
                  "// --- REG-2: Watch and Play Key Moments share the same venue-side mapping ---\n// MatchScreen now centralises managed-match construction in buildInputs()/\n// startManagedMatch(), so both Watch Match and Play Key Moments consume the\n// same P2 adapter rather than duplicating home/away player mapping.\nconst managedInputSrc = (()=>{\n  const start=matchScreenSrc.indexOf('function buildInputs');\n  if(start===-1) return '';\n  return matchScreenSrc.slice(start, start+1800);\n})();\nconst managedStartSrc = (()=>{\n  const start=matchScreenSrc.indexOf('async function startManagedMatch');\n  if(start===-1) return '';\n  return matchScreenSrc.slice(start, start+4200);\n})();\nchk('REG: managed matches map venue side through resolved.userIsHome', managedInputSrc.includes('userIsHome:resolved.userIsHome'));\nchk('REG: Watch and Play share buildInputs', managedStartSrc.includes('const inputs = buildInputs(matchCtx, resolved)'));\nchk('REG: Watch delegates to shared managed lifecycle', matchScreenSrc.includes('startManagedMatch(false)'));\nchk('REG: Play Key Moments delegates to shared managed lifecycle', matchScreenSrc.includes('startManagedMatch(true)'));",
              ),
              (
                  "chk('INBOX: newsInjury wired in MatchScreen.svelte', matchScreenSrc.includes('newsInjury({ name: inj.playerName'));\nchk('INBOX: newsAIBid wired in MatchScreen.svelte',  matchScreenSrc.includes('newsAIBid({ name: o.playerName'));",
                  "chk('INBOX: newsInjury wired in MatchScreen.svelte', matchScreenSrc.includes('newsInjury({ name:inj.playerName'));\nchk('INBOX: newsAIBid wired in MatchScreen.svelte',  matchScreenSrc.includes('newsAIBid({ name:o.playerName'));",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one validator fragment, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/phase2-validator-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/validate.js
          git commit -m "Align legacy validation with Play Key Moments lifecycle"
          git push origin HEAD:feat/playable-key-moments-mvp
